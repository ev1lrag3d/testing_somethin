name: Android APK (original app)

on:
  push:
    branches: [ "android-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build original Echo Music APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true
    - name: Debug keystore
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
    - name: Build APK
      shell: bash
      run: |
        chmod +x gradlew
        set -o pipefail
        ./gradlew assembleUniversalFossDebug --no-daemon 2>&1 | tee build.log
    - name: Report errors as annotations
      if: failure()
      shell: bash
      run: |
        set +e +o pipefail
        msg=$(grep -E "^e: |FAILED|What went wrong|error:" -A3 build.log 2>/dev/null | head -40)
        echo "::error title=APK build failed::${msg//$'\n'/%0A}"
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: EchoMusic-Android-APK-v1
        path: app/build/outputs/apk/**/*.apk
